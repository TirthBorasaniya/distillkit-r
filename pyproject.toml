[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distillkit-r"
version = "0.1.0"
requires-python = ">=3.11, <3.12"
dependencies = [
    "torch==2.5.1",
    "transformers==4.47.0",
    "peft==0.14.0",
    "accelerate==1.2.0",
    "bitsandbytes==0.45.0",
    "datasets==3.2.0",
    "safetensors==0.4.5",
    "huggingface-hub==0.27.0",
    "numpy==1.26.4",
    "scipy==1.14.1",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
train = ["trl==0.12.2", "mlflow==2.18.0", "wandb==0.19.1"]
eval  = ["lighteval==0.7.1"]
dev   = ["ruff", "mypy", "pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
